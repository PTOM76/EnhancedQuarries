plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.6-SNAPSHOT" apply false
    id "me.modmuss50.mod-publish-plugin" version "2.2.0" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        mavenLocal()
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.pitan76.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.terraformersmc.com/releases" }
        maven {
            name = "BuildCraft"
            url = "https://mod-buildcraft.com/maven"
        }
        maven { url "https://cursemaven.com" }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    }

    if (name in "fabric,forge,neoforge".split(",")) {
        apply plugin: "me.modmuss50.mod-publish-plugin"

        def loader = name
        def versions = ['1.20.3', '1.20.4']
        if (loader != "neoforge") {
            versions = ['1.18', '1.18.1', '1.18.2', '1.19', '1.19.1', '1.19.2', '1.20', '1.20.1', '1.20.3', '1.20.4']
        }
        if (loader != "forge") {
            versions += ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6',
                         '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2']
        }

        publishMods {
            file = tasks.named("remapJar").flatMap { it.archiveFile }
            version = rootProject.mod_version + "-" + loader
            displayName = rootProject.archives_base_name + " " + rootProject.mod_version + " (" + loader + ")"
            changelog = rootProject.changelog + "\n" + "MCPitanLib version: " + rootProject.mcpitanlib_version.split(":")[1]
            type = STABLE
            modLoaders.add(loader)

            def curseforgeToken = providers.environmentVariable("CURSEFORGE_TOKEN")
            def modrinthToken = providers.environmentVariable("MODRINTH_TOKEN")

            if (curseforgeToken.isPresent()) {
                curseforge {
                    accessToken = curseforgeToken
                    projectId = "528338"
                    minecraftVersions.addAll(versions)

                    client = true
                    server = true

                    requires("mcpitanlibarch")
                    optional("cloth-config")
                    if (loader == "fabric") {
                        requires("fabric-api")
                        optional("techreborn")
                        optional("modmenu")
                        optional("storagebox-fabric")
                    }
                }
            }

            if (modrinthToken.isPresent()) {
                modrinth {
                    accessToken = modrinthToken
                    projectId = "JcIgEOzn"
                    minecraftVersions.addAll(versions)

                    requires("uNRoUnGT")
                    if (loader == "fabric") requires("P7dR8mSH")
                }
            }
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        if (project.name == "neoforge") {
            options.release = 17
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        } else {
            options.release = 8
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
    }

    java {
        withSourcesJar()
    }
}

tasks.register('releaseMods') {
    dependsOn("fabric:publishMods")
    dependsOn("forge:publishMods")
    dependsOn("neoforge:publishMods")
}
