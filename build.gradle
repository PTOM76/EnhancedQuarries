plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.6-SNAPSHOT" apply false
    id 'com.matthewprenger.cursegradle' version '1.+'
    id "com.modrinth.minotaur" version "2.+"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "com.modrinth.minotaur"
    apply plugin: "com.matthewprenger.cursegradle"

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        mavenLocal()
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.pitan76.net/" }
        maven { url "https://maven.neoforged.net/releases" }
        maven { url "https://maven.terraformersmc.com/releases" }
        maven {
            name = "BuildCraft"
            url = "https://mod-buildcraft.com/maven"
        }
        maven { url "https://cursemaven.com" }
        maven { url 'https://jitpack.io' }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    }

    if (name in "fabric,forge,neoforge".split(",")) {
        var modLoader = name

        if (System.getenv("CURSEFORGE_TOKEN") != null) {
            curseforge {
                apiKey = System.getenv("CURSEFORGE_TOKEN")
                project {
                    id = '528338'
                    changelog = rootProject.changelog + "\nMCPitanLib version: " + mcpitanlib_version.split(":")[1]
                    releaseType = 'release'
                    if (modLoader == "fabric") addGameVersion "Fabric"
                    if (modLoader == "forge") addGameVersion "Forge"
                    if (modLoader == "neoforge") addGameVersion "NeoForge"

                    if (modLoader == "neoforge") {
                        addGameVersion '1.20.3'
                        addGameVersion '1.20.4'
                    } else {
                        addGameVersion '1.18'
                        addGameVersion '1.18.1'
                        addGameVersion '1.18.2'
                        addGameVersion '1.19'
                        addGameVersion '1.19.1'
                        addGameVersion '1.19.2'
                        addGameVersion '1.20'
                        addGameVersion '1.20.1'
                        addGameVersion '1.20.3'
                        addGameVersion '1.20.4'
                    }

                    if (modLoader != "forge") {
                        addGameVersion '1.21'
                        addGameVersion '1.21.1'
                        addGameVersion '1.21.2'
                        addGameVersion '1.21.3'
                        addGameVersion '1.21.4'
                        addGameVersion '1.21.5'
                        addGameVersion '1.21.6'
                        addGameVersion '1.21.7'
                        addGameVersion '1.21.8'
                        addGameVersion '1.21.9'
                        addGameVersion '1.21.10'
                        addGameVersion '1.21.11'
                        addGameVersion '26.1'
                        addGameVersion '26.1.1'
                    }

                    relations {
                        if (modLoader == "fabric") {
                            requiredDependency "fabric-api"
                            optionalDependency "techreborn"
                            optionalDependency "modmenu"
                            optionalDependency "storagebox-fabric"
                        }
                        requiredDependency "mcpitanlibarch"
                        optionalDependency "cloth-config"
                    }

                    mainArtifact(tasks.remapJar)
                }
                options {
                    forgeGradleIntegration = false
                }
            }
        }

        if (System.getenv("MODRINTH_TOKEN") != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                projectId = 'JcIgEOzn'
                versionNumber = rootProject.mod_version + "-" + modLoader
                gameVersions = ['1.18', '1.18.1', '1.18.2', '1.19', '1.19.1', '1.19.2', '1.20', '1.20.1', '1.20.3', '1.20.4']
                if (modLoader == "neoforge") {
                    gameVersions = ['1.20.3', '1.20.4']
                }
                if (modLoader != "forge") {
                    gameVersions.addAll(['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6',
                                         '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1'])
                }

                versionType = 'release'
                uploadFile = tasks.remapJar
                changelog = rootProject.changelog + "\nMCPitanLib version: " + mcpitanlib_version.split(":")[1]
                loaders = [modLoader]
                dependencies {
                    if (modLoader == "fabric") {
                        required.project "P7dR8mSH" // Fabric API
                    }
                    required.project "uNRoUnGT" // MCPitanLibarch
                }
            }
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        if (project.name == "neoforge") {
            options.release = 17
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        } else {
            options.release = 8
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
    }

    java {
        withSourcesJar()
    }
}

tasks.register('releaseMods') {
    dependsOn("fabric:modrinth")
    dependsOn("forge:modrinth")
    dependsOn("neoforge:modrinth")
}
